format = """
$username$hostname$directory$git_branch$git_status$python$docker_context$kubernetes$cmd_duration
$line_break$character"""

add_newline = false

[username]
show_always = false

[hostname]
ssh_only = true

[directory]
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = " "

[git_status]
disabled = false

[python]
symbol = "py "

[docker_context]
disabled = false
symbol = "docker "

[kubernetes]
disabled = false
symbol = "k8s "

[cmd_duration]
min_time = 2000
format = "took [$duration]($style) "
